[meta]
ini_version = 7
config_name = usrp_default

[hw]
name = usrp5
backend = usrp
unit_id = 0
ioo_type = 0
num_ch = 5

[daq]
log_level = 5
daq_buffer_size = 262144
center_freq = 700000000
sample_rate = 2400000
gain = 300
sample_bit_depth = 16
en_noise_source_ctr = 1

[usrp]
# 3x USRP B210 (LibreSDR B220mini clones), 2+2+1 = 5 coherent RX channels.
# USRP 0 is the PPS master (its GPIO PPS output feeds USRPs 1 and 2).
serial_0 = 5RW1Z1Q
num_ch_0 = 2
serial_1 = AJR6D8M
num_ch_1 = 2
serial_2 = 0LHFT70
num_ch_2 = 1
subdev = A:A A:B
antenna = RX2
pps_settle_ms = 2500
fpga_path = ../util/bundled/libresdr_b210.bin
fw_path = ../util/bundled/usrp_b200_fw.hex
cal_gain_db = 30
# Coarse manual per-device stream-start trim (positive = start that device's
# stream earlier), left at 0 by default. usrp_daq.cc now measures and
# corrects the per-run integer-sample channel offset automatically at
# startup (AD9361 digital-interface phase state is random per power-cycle
# but fixed for the run, so a static guess here would just go stale) -- only
# set these if you need an additional fixed trim on top of that, e.g. for a
# genuine cabling-length asymmetry that's stable across restarts.
stream_start_offset_ns_0 = 0
stream_start_offset_ns_1 = 0
stream_start_offset_ns_2 = 0

[noise_source]
# HackRF One, transmitting synthesized broadband noise for calibration. The
# external RF switch automatically routes this into the USRPs' antenna
# inputs whenever TX is active -- there is no software switch control.
hackrf_serial = 000000000000000066a062dc2a4c7f9f
tx_sample_rate = 8000000
tx_gain_db = 47
amp_enable = 0
tx_freq = 0

[pre_processing]
cpi_size = 1048576
decimation_ratio = 1
fir_relative_bandwidth = 1.0
fir_tap_size = 1
fir_window = hann
en_filter_reset = 0

[calibration]
corr_size = 65536
std_ch_ind = 0
en_iq_cal = 1
amplitude_cal_mode = channel_power
en_gain_tune_init = 0
gain_lock_interval = 0
unified_gain_control = 0
require_track_lock_intervention = 0
cal_track_mode = 2
cal_frame_interval = 687
cal_frame_burst_size = 10
# Max IQ mismatch a channel may have vs. the standard channel (std_ch_ind)
# during STATE_IQ_CAL/tracking before it's flagged out of tolerance and
# recalibration is retried (see delay_sync.py). Both must be positive
# integers (ini_checker.py rejects < 1); amplitude_tolerance is in dB
# (converted internally to a voltage ratio), phase_tolerance is in degrees.
# Tighter values enforce a more precise calibration but make lock
# harder/slower to reach; looser values lock faster but let more residual
# mismatch through to the DOA math. Typical values across configs: 1-10 dB,
# 1-5 deg.
amplitude_tolerance = 2
phase_tolerance = 1
maximum_sync_fails = 10
# Give up correcting fractional (sub-sample) delay skew after this many
# seconds and accept the residual instead of retrying forever. Must be a
# positive number (seconds, float ok). The skew here is a fixed
# per-power-cycle characteristic of the AD9361 RF frontend, not a drift, so
# an unbounded retry loop can otherwise deadlock in
# STATE_FRAC_SAMPLE_CAL/STATE_FRAC_SYNC_WAIT waiting for a convergence that
# never comes on an unlucky power-cycle. Giving up here is NOT treated as a
# sync failure -- it just accepts the current alignment and proceeds to
# STATE_IQ_CAL. Set higher here than the other configs since this is the
# hardware where slow/non-convergent sub-sample skew has actually been seen.
frac_cal_timeout_s = 15
# iq_adjust_* are inert defaults -- these need re-measurement against the
# USRP+HackRF RF chain (the touchstone/cable data under _calibration/ was
# characterized for the RTL-SDR/KrakenSDR cabling, not this hardware).
iq_adjust_source = explicit-time-delay
iq_adjust_amplitude = 0,0,0,0
iq_adjust_time_delay_ns = 0, 0, 0, 0

[adpis]
en_adpis = 0
adpis_proc_size = 8192
adpis_gains_init = 0,0,0,0,0

[data_interface]
out_data_iface_type = shmem
